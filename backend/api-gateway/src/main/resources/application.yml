server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ── Vault optionnel — ne crashe pas si Vault pas encore prêt ──────────
  config:
    import: "optional:vault://"

  cloud:
    # ── Vault ──────────────────────────────────────────────────────────
    vault:
      uri: http://vault.monitoring.svc.cluster.local:8200
      fail-fast: false                          # ← ne pas crasher si Vault absent
      authentication: kubernetes
      kubernetes:
        role: ecommerce-app
        service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kv:
        enabled: true
        backend: kv
        default-context: ecommerce
        application-name: database

    # ── Gateway ────────────────────────────────────────────────────────
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ["*"]
            allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - RemoveResponseHeader=X-Powered-By
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: product-service
          uri: http://product-service.ecommerce.svc.cluster.local:8082
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: product-service
                fallbackUri: forward:/fallback/product-service
        - id: order-service
          uri: http://order-service.ecommerce.svc.cluster.local:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: order-service
                fallbackUri: forward:/fallback/order-service
        - id: user-service
          uri: http://user-service.ecommerce.svc.cluster.local:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: user-service
                fallbackUri: forward:/fallback/user-service

  # ── Redis ──────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:redis.ecommerce.svc.cluster.local}
      port: 6379
      password: ${REDIS_PASSWORD:Ecom2024}     # ← valeur par défaut ajoutée
      timeout: 2000ms
      lettuce:
        pool:
          enabled: false
        shutdown-timeout: 100ms

  # ── Keycloak ───────────────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://keycloak.keycloak.svc.cluster.local:8080}/realms/ecommerce/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:30082/realms/ecommerce}

fallback:
  message: "Service non disponible pour le moment. Veuillez réessayer plus tard."

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,ping
  health:
    redis:
      enabled: false

resilience4j:
  circuitbreaker:
    instances:
      productCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        timeoutDuration: 10s
      orderCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        timeoutDuration: 10s

logging:
  level:
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
    io.lettuce: WARN
    org.springframework.vault: WARN          # ← réduire les logs Vault
    com.ecommerce: INFO
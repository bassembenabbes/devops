server:
  port: 8082

spring:
  application:
    name: product-service

  # ── Vault optionnel ────────────────────────────────────────────────────
  config:
    import: "optional:vault://"

  cloud:
    vault:
      uri: http://vault.monitoring.svc.cluster.local:8200
      fail-fast: false                          # ← ne pas crasher si Vault absent
      authentication: kubernetes
      kubernetes:
        role: ecommerce-app
        service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kv:
        enabled: true
        backend: kv
        default-context: ecommerce
        application-name: database

  # ── MongoDB ────────────────────────────────────────────────────────────
  data:
    mongodb:
      uri: mongodb://${mongodb_root_username:root}:${mongodb_root_password:Ecom2024}@${MONGO_HOST:mongodb.ecommerce.svc.cluster.local}:27017/products_db?authSource=admin&connectTimeoutMS=30000&socketTimeoutMS=30000&serverSelectionTimeoutMS=60000&retryWrites=true&retryReads=true

    # ── Redis ──────────────────────────────────────────────────────────
    redis:
      host: ${REDIS_HOST:redis.ecommerce.svc.cluster.local}
      port: 6379
      password: ${redis_password:Ecom2024}      # ← valeur par défaut ajoutée
      lettuce:
        shutdown-timeout: 100ms

  # ── Cache ──────────────────────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 1800000

  # ── Keycloak ───────────────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://keycloak.keycloak.svc.cluster.local:8080}/realms/ecommerce/protocol/openid-connect/certs

  # ── Exclusions autoconfigure ───────────────────────────────────────────
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,ping

logging:
  level:
    org.springframework.data.mongodb.core: INFO
    org.springframework.vault: WARN            # ← réduire les logs Vault
    com.ecommerce: INFO
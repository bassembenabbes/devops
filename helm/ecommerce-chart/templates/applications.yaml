# ═══════════════════════════════════════════════════════════════════════
#  APPLICATIONS — Spring Boot Microservices + Angular Frontend
# ═══════════════════════════════════════════════════════════════════════

{{- define "ecommerce.microservice" -}}
{{- $name := .name -}}
{{- $svc  := .svc  -}}
{{- $root := .root -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.global.namespace }}
  labels:
    {{- include "ecommerce.labels" $root | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.global.namespace }}
  labels:
    {{- include "ecommerce.labels" $root | nindent 4 }}
    app: {{ $name }}
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $name }}
        version: {{ $root.Chart.AppVersion | quote }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: {{ $svc.port | quote }}
    spec:
      serviceAccountName: {{ $name }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy | default "Never" }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: LOGSTASH_ENABLED
              value: "true"
            - name: SERVER_PORT
              value: {{ $svc.port | quote }}
            - name: VAULT_ADDR
              value: "http://vault.monitoring.svc.cluster.local:{{ $root.Values.vault.port }}"
            - name: KEYCLOAK_URL
              value: "http://keycloak.keycloak.svc.cluster.local"
            - name: KEYCLOAK_ISSUER
              value: "http://localhost:30082/realms/ecommerce"  # ← issuer vu par le navigateur
            - name: REDIS_HOST
              value: "redis-master.ecommerce.svc.cluster.local"
            # REDIS_PASSWORD sera récupéré de Vault
            - name: MONGO_HOST
              value: "mongodb.ecommerce.svc.cluster.local"
            # POSTGRES_HOST sera récupéré de Vault
            # POSTGRES_PASSWORD sera récupéré de Vault
          volumeMounts:
            - name: vault-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          # startupProbe: laisse jusqu'à 10 min au JVM pour démarrer
          startupProbe:
            httpGet:
              path: {{ $svc.livenessPath | default "/actuator/health/liveness" }}
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: {{ $svc.startupFailureThreshold | default 60 }}
            timeoutSeconds: 5
          # livenessProbe: JVM vivante (ping uniquement)
          livenessProbe:
            httpGet:
              path: {{ $svc.livenessPath | default "/actuator/health/liveness" }}
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $svc.livenessInitialDelay | default 60 }}
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
          # readinessProbe: prêt à recevoir du trafic
          readinessProbe:
            httpGet:
              path: {{ $svc.readinessPath | default "/actuator/health/readiness" }}
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $svc.readinessInitialDelay | default 60 }}
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: vault
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.global.namespace }}
  labels:
    {{- include "ecommerce.labels" $root | nindent 4 }}
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  {{- if $svc.nodePort }}
  type: NodePort
  {{- else }}
  type: ClusterIP
  {{- end }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
      {{- if $svc.nodePort }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
{{- end }}

{{/* ── Déploiement des microservices ────────────────────────────────── */}}
{{- if .Values.apiGateway.enabled }}
{{ include "ecommerce.microservice" (dict "name" .Values.apiGateway.name "svc" .Values.apiGateway "root" .) }}
{{- end }}

{{- if .Values.productService.enabled }}
{{ include "ecommerce.microservice" (dict "name" .Values.productService.name "svc" .Values.productService "root" .) }}
{{- end }}

{{- if .Values.userService.enabled }}
{{ include "ecommerce.microservice" (dict "name" .Values.userService.name "svc" .Values.userService "root" .) }}
{{- end }}

{{- if .Values.orderService.enabled }}
{{ include "ecommerce.microservice" (dict "name" .Values.orderService.name "svc" .Values.orderService "root" .) }}
{{- end }}

# ── Frontend Angular ───────────────────────────────────────────────────
{{- if .Values.frontend.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicas | default 1 }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "Never" }}
          ports:
            - containerPort: 80
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    app: frontend
spec:
  selector:
    app: frontend
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: {{ .Values.frontend.nodePort }}
{{- end }}

# ═══════════════════════════════════════════════════════════════════════
#  MONITORING — Prometheus + Grafana
# ═══════════════════════════════════════════════════════════════════════

# ── RBAC Prometheus ────────────────────────────────────────────────────
{{- if .Values.prometheus.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
# ── Prometheus Config ──────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

      - job_name: api-gateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: [api-gateway.ecommerce.svc.cluster.local:{{ .Values.apiGateway.port }}]

      - job_name: product-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: [product-service.ecommerce.svc.cluster.local:{{ .Values.productService.port }}]

      - job_name: order-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: [order-service.ecommerce.svc.cluster.local:{{ .Values.orderService.port }}]

      - job_name: keycloak
        metrics_path: /metrics
        static_configs:
          - targets: [keycloak.keycloak.svc.cluster.local:{{ .Values.keycloak.managementPort }}]

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
# ── Prometheus Deployment ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --web.enable-lifecycle
          ports:
            - containerPort: {{ .Values.prometheus.port }}
          resources: {{- toYaml .Values.prometheus.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /-/ready, port: {{ .Values.prometheus.port }} }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: {{ .Values.prometheus.port }} }
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: {{ .Values.prometheus.port }}
{{- end }}

# ── Grafana ────────────────────────────────────────────────────────────
{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:{{ .Values.prometheus.port }}
        isDefault: true
        editable: true
        jsonData:
          timeInterval: "15s"
          httpMethod: POST
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: ecommerce
        orgId: 1
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.grafana.port }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: monitoring-secrets, key: GRAFANA_ADMIN_PASSWORD }
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_EXPLORE_ENABLED
              value: "true"
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "true"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/overview/01-ecommerce-overview.json
            - name: GF_LOG_LEVEL
              value: warn
          resources: {{- toYaml .Values.grafana.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/health, port: {{ .Values.grafana.port }} }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/health, port: {{ .Values.grafana.port }} }
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-overview
              mountPath: /var/lib/grafana/dashboards/overview
            - name: dashboard-jvm
              mountPath: /var/lib/grafana/dashboards/jvm
            - name: dashboard-infra
              mountPath: /var/lib/grafana/dashboards/infra
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboard-config
          configMap: { name: grafana-dashboards-config }
        - name: dashboard-overview
          configMap: { name: grafana-dashboard-overview }
        - name: dashboard-jvm
          configMap: { name: grafana-dashboard-jvm }
        - name: dashboard-infra
          configMap: { name: grafana-dashboard-infra }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: grafana
spec:
  selector:
    app: grafana
  type: NodePort
  ports:
    - port: {{ .Values.grafana.port }}
      targetPort: {{ .Values.grafana.port }}
      nodePort: {{ .Values.grafana.nodePort }}
{{- end }}

# ── Elasticsearch ──────────────────────────────────────────────────────
{{- if .Values.elasticsearch.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: elasticsearch
spec:
  replicas: {{ .Values.elasticsearch.replicas }}
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: {{ .Values.elasticsearch.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.elasticsearch.port }}
          env:
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: xpack.security.enabled
              value: "false"
            - name: discovery.type
              value: single-node
          resources: {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: elasticsearch-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - port: {{ .Values.elasticsearch.port }}
      targetPort: {{ .Values.elasticsearch.port }}
{{- end }}

# ── Kibana ─────────────────────────────────────────────────────────────
{{- if .Values.kibana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: {{ .Values.kibana.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.kibana.port }}
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch.monitoring.svc.cluster.local:{{ .Values.elasticsearch.port }}
          resources: {{- toYaml .Values.kibana.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/status, port: {{ .Values.kibana.port }}}
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet: { path: /api/status, port: {{ .Values.kibana.port }}}
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: kibana
spec:
  selector:
    app: kibana
  type: NodePort
  ports:
    - port: {{ .Values.kibana.port }}
      targetPort: {{ .Values.kibana.port }}
      nodePort: {{ .Values.kibana.nodePort }}
{{- end }}

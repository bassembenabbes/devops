# ═══════════════════════════════════════════════════════════════════════
#  VAULT
# ═══════════════════════════════════════════════════════════════════════

{{- if .Values.vault.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-token-reviewer
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
data:
  vault.hcl: |
    listener "tcp" {
      address = "0.0.0.0:{{ .Values.vault.port }}"
      tls_disable = "true"
    }
    storage "file" {
      path = "{{ .Values.vault.storagePath }}"
    }
    ui = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: vault
spec:
  replicas: {{ .Values.vault.replicas }}
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36.1
          command: ["sh", "-c", "chmod -R 777 /vault/config /vault/data"]
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/data
      containers:
        - name: vault
          image: {{ .Values.vault.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          ports:
            - containerPort: {{ .Values.vault.port }}
            - containerPort: {{ .Values.vault.uiPort }}
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:{{ .Values.vault.port }}
            - name: VAULT_API_ADDR
              value: http://vault.monitoring.svc.cluster.local:{{ .Values.vault.port }}
            - name: VAULT_CLUSTER_ADDR
              value: http://vault.monitoring.svc.cluster.local:{{ .Values.vault.port }}
          args:
            - server
            - -config=/vault/config/vault.hcl
          resources: {{- toYaml .Values.vault.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/data
      volumes:
        - name: config
          configMap: { name: vault-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: vault
spec:
  selector:
    app: vault
  type: NodePort
  ports:
    - name: http
      port: {{ .Values.vault.port }}
      targetPort: {{ .Values.vault.port }}
    - name: ui
      port: {{ .Values.vault.uiPort }}
      targetPort: {{ .Values.vault.uiPort }}
      nodePort: {{ .Values.vault.nodePort }}
{{- end }}

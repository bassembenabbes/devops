# ═══════════════════════════════════════════════════════════════════════
#  VAULT - Mode Développement
#  ⚠️  NE PAS UTILISER EN PRODUCTION
# ═══════════════════════════════════════════════════════════════════════

{{- if .Values.vault.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: vault
spec:
  selector:
    app: vault
  type: NodePort
  ports:
    - name: http
      port: {{ .Values.vault.port }}
      targetPort: {{ .Values.vault.port }}
      nodePort: {{ .Values.vault.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: monitoring
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: vault
spec:
  replicas: {{ .Values.vault.replicas }}
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: {{ .Values.vault.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.vault.port }}
          env:
            {{- if .Values.vault.devMode }}
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: {{ .Values.vault.devRootToken | default "root" }}
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:{{ .Values.vault.port }}"
            {{- else }}
            - name: VAULT_ADDR
              value: http://127.0.0.1:{{ .Values.vault.port }}
            {{- end }}
          {{- if .Values.vault.devMode }}
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:{{ .Values.vault.port }}
          {{- else }}
          args:
            - server
          {{- end }}
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: {{ .Values.vault.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: {{ .Values.vault.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.vault.resources | nindent 12 }}
          {{- if not .Values.vault.devMode }}
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          volumeMounts:
            - name: data
              mountPath: /vault/data
      volumes:
        - name: data
          emptyDir: {}
          {{- end }}
{{- end }}

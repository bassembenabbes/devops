# ═══════════════════════════════════════════════════════════════════════
#  KEYCLOAK 26 + PostgreSQL dédié
# ═══════════════════════════════════════════════════════════════════════
{{- if .Values.keycloak.enabled }}
---
# ── PostgreSQL Keycloak ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kc-postgres
  namespace: keycloak
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: kc-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kc-postgres
  template:
    metadata:
      labels:
        app: kc-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.keycloak.db.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.keycloak.db.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.keycloak.db.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-secrets, key: KC_DB_PASSWORD }
          resources:
            requests: { memory: "64Mi",  cpu: "25m" }
            limits:   { memory: "128Mi", cpu: "200m" }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.keycloak.db.username | quote }}, "-d", {{ .Values.keycloak.db.name | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: kc-postgres
  namespace: keycloak
spec:
  selector:
    app: kc-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# ── Keycloak 26 ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: wait-for-pg
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kc-postgres 5432; do echo waiting for postgres; sleep 3; done; echo postgres ready"]
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: {{ .Values.keycloak.port }}
            - name: management
              containerPort: {{ .Values.keycloak.managementPort }}
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-secrets, key: KEYCLOAK_ADMIN_PASSWORD }
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://kc-postgres.keycloak.svc.cluster.local:5432/{{ .Values.keycloak.db.name }}"
            - name: KC_DB_USERNAME
              value: {{ .Values.keycloak.db.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-secrets, key: KC_DB_PASSWORD }
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_PORT
              value: {{ .Values.keycloak.managementPort | quote }}
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_LOG_LEVEL
              value: WARN
          resources: {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.keycloak.managementPort }}
            initialDelaySeconds: 180
            periodSeconds: 15
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.keycloak.managementPort }}
            initialDelaySeconds: 240
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.keycloak.managementPort }}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
            timeoutSeconds: 5
      volumes:
        - name: realm-config
          configMap:
            name: kc-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
    app: keycloak
spec:
  selector:
    app: keycloak
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.keycloak.port }}
      nodePort: {{ .Values.keycloak.nodePort }}
{{- end }}
